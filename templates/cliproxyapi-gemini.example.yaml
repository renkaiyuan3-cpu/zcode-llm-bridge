# CLIProxyAPI 示例配置 —— 仅用于把 Antigravity 的 Gemini 模型接入 ZCode
#
# 安装：把 CLIProxyAPI 二进制放到 ~/.cliproxyapi/cli-proxy-api，
#       本文件保存为 ~/.cliproxyapi/config.yaml。
# 说明：api-keys 是「你的本地客户端访问 CPA 用的钥匙」，自定义任意随机字符串即可；
#       apply-gemini-provider.py 会自动从 ~/.cliproxyapi/.keys 第一行读取。
#       （若首次启动时留空，部分版本会自动生成并写入 .keys 文件。）
host: "127.0.0.1"
port: 8317
auth-dir: "~/.cliproxyapi/auth"
api-keys:
  - "sk-cpa-换成本机随机字符串"
remote-management:
  allow-remote: false
  # secret-key 是 Web 管理后台的密码哈希；只在需要后台时配置。
  # secret-key: "$2a$10$...."
  disable-control-panel: false
debug: false
logging-to-file: true
logs-max-total-size-mb: 50
request-retry: 3
